name: lint
on:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1
      - name: lint yaml files
        uses: owenlamont/ryl-action@v0.26.1
        with:
          args: check .
